<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تنزيل دكّاني · Doukkany</title>
<meta name="description" content="Download Doukkany: point of sale and shop management for Windows and Android. Always the latest version.">
<style>
  :root { --green:#1f8a4c; --ink:#1d2421; --muted:#5d6a63; --bg:#f6f8f7; --card:#ffffff; --line:#dfe5e2; --error:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", Tahoma, Arial, sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; }
  main { max-width:720px; margin:0 auto; padding:16px 16px 40px; }
  .langs { display:flex; justify-content:flex-end; gap:6px; margin-bottom:24px; }
  .langs button { font:inherit; background:transparent; border:1px solid var(--line); color:var(--ink); border-radius:999px; padding:8px 14px; min-height:44px; cursor:pointer; }
  .langs button[aria-pressed="true"] { background:var(--green); border-color:var(--green); color:#fff; }
  h1 { color:var(--green); margin:0 0 4px; font-size:2.2rem; }
  h2 { font-size:1.15rem; margin:0 0 6px; }
  a { color:var(--green); }
  .card { background:var(--card); border-radius:16px; padding:20px; margin:16px 0; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .btn { display:inline-block; font:inherit; font-weight:600; background:var(--green); color:#fff; text-decoration:none; padding:12px 20px; border-radius:12px; margin:6px 0; min-height:48px; border:0; cursor:pointer; }
  .btn.outline { background:transparent; color:var(--green); border:2px solid var(--green); padding:10px 18px; }
  .muted { color:var(--muted); }
  .small { font-size:.9rem; }
  .version:empty, .status:empty { display:none; }
  .email-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .email-row input { flex:1 1 220px; font:inherit; padding:11px 12px; min-height:48px; border:1px solid var(--line); border-radius:12px; direction:ltr; }
  .email-row .btn { margin:0; }
  .error { color:var(--error); }
  .error:empty { display:none; }
  .hint { color:var(--muted); font-size:.9rem; font-weight:400; }
  .videos { margin:8px 0 12px; padding-inline-start:28px; }
  .videos li { margin:0; padding:2px 0; }
  .videos a { display:inline-block; padding:8px 0; text-decoration:none; }
  .videos a:hover { text-decoration:underline; }
  .duration { color:var(--muted); font-size:.85rem; margin-inline-start:6px; }
</style>
</head>
<body>
<main>
  <nav class="langs" aria-label="Language">
    <button type="button" data-lang="ar" lang="ar">العربية</button>
    <button type="button" data-lang="fr" lang="fr">Français</button>
    <button type="button" data-lang="en" lang="en">English</button>
  </nav>

  <h1>Doukkany</h1>
  <p class="muted" data-t="tagline">برنامج بيع وتسيير للمحلات. يعمل دون إنترنت.</p>

  <section class="card">
    <h2 data-t="winTitle">الحاسوب: Windows 10 وما بعده (64 بت)</h2>
    <a class="btn" id="win-btn" href="https://github.com/dzstoredzd/doukkany-releases/releases/latest" data-t="winBtn">تنزيل لـ Windows</a>
    <div class="muted small"><span class="version" id="version"></span></div>
    <p class="muted small status" id="status" role="status"></p>
  </section>

  <section class="card">
    <h2 data-t="androidTitle">الهاتف: Android</h2>
    <a class="btn outline" href="https://play.google.com/store/apps/details?id=com.yousoft.doukkany" data-t="androidBtn">التحميل من Google Play</a>
  </section>

  <section class="card">
    <h2 data-t="emailTitle">أرسل الروابط إلى بريدك</h2>
    <p class="muted small" data-t="emailHelp">لتفتحها لاحقًا على الحاسوب.</p>
    <form class="email-row" id="email-form" novalidate>
      <input type="email" id="email" autocomplete="email" inputmode="email" placeholder="name@example.com" aria-label="Email" data-t-aria="emailLabel">
      <button class="btn" type="submit" data-t="emailBtn">أرسل الروابط</button>
    </form>
    <p class="small error" id="email-error" role="alert"></p>
  </section>

  <section class="card">
    <h2><span data-t="tutorialTitle">دورة تعليمية سريعة</span> <span class="hint" data-t="tutorialHint">(اضغط على اسم الحلقة لمشاهدة الفيديو)</span></h2>
    <ol class="videos" id="videos"></ol>
    <a class="small" href="https://www.youtube.com/playlist?list=PLATmdIDov8C4" data-t="tutorialAll">مشاهدة القائمة كاملة على YouTube</a>
  </section>
</main>
<script>
(function () {
  var TEXT = {
    ar: {
      title: 'تنزيل دكّاني · Doukkany',
      tagline: 'برنامج بيع وتسيير للمحلات. يعمل دون إنترنت.',
      winTitle: 'الحاسوب: Windows 10 وما بعده (64 بت)',
      winBtn: 'تنزيل لـ Windows',
      version: 'الإصدار ',
      starting: 'سيبدأ التنزيل بعد لحظات…',
      androidTitle: 'الهاتف: Android',
      androidBtn: 'التحميل من Google Play',
      emailTitle: 'أرسل الروابط إلى بريدك',
      emailHelp: 'لتفتحها لاحقًا على الحاسوب.',
      emailLabel: 'البريد الإلكتروني',
      emailBtn: 'أرسل الروابط',
      emailBad: 'هذا البريد غير صحيح. تحقّق منه.',
      mailSubject: 'روابط تنزيل دكّاني',
      mailBody: 'روابط تنزيل دكّاني (أحدث إصدار دائمًا):\n\nالحاسوب (Windows 10 وما بعده):\n{win}\n\nالهاتف (Android):\n{play}\n\nصفحة التنزيل:\n{page}\n',
      tutorialTitle: 'دورة تعليمية سريعة',
      tutorialHint: '(اضغط على اسم الحلقة لمشاهدة الفيديو)',
      tutorialAll: 'مشاهدة القائمة كاملة على YouTube'
    },
    fr: {
      title: 'Télécharger Doukkany',
      tagline: 'Caisse et gestion pour les magasins. Fonctionne sans internet.',
      winTitle: 'Ordinateur : Windows 10 et plus (64 bits)',
      winBtn: 'Télécharger pour Windows',
      version: 'Version ',
      starting: 'Le téléchargement va commencer…',
      androidTitle: 'Téléphone : Android',
      androidBtn: 'Disponible sur Google Play',
      emailTitle: 'Envoyer les liens par e-mail',
      emailHelp: 'Pour les ouvrir plus tard sur l’ordinateur.',
      emailLabel: 'Adresse e-mail',
      emailBtn: 'Envoyer les liens',
      emailBad: 'Cette adresse e-mail n’est pas valide. Vérifiez-la.',
      mailSubject: 'Liens de téléchargement Doukkany',
      mailBody: 'Liens de téléchargement Doukkany (toujours la dernière version) :\n\nOrdinateur (Windows 10 et plus) :\n{win}\n\nTéléphone (Android) :\n{play}\n\nPage de téléchargement :\n{page}\n',
      tutorialTitle: 'Formation rapide',
      tutorialHint: '(cliquez sur le nom de l’épisode pour voir la vidéo)',
      tutorialAll: 'Voir toute la liste sur YouTube'
    },
    en: {
      title: 'Download Doukkany',
      tagline: 'Point of sale and shop management for shops. Works without internet.',
      winTitle: 'Computer: Windows 10 and newer (64-bit)',
      winBtn: 'Download for Windows',
      version: 'Version ',
      starting: 'Your download will start in a moment…',
      androidTitle: 'Phone: Android',
      androidBtn: 'Get it on Google Play',
      emailTitle: 'Send the links to your email',
      emailHelp: 'To open them later on your computer.',
      emailLabel: 'Email address',
      emailBtn: 'Send the links',
      emailBad: 'This email address is not valid. Please check it.',
      mailSubject: 'Doukkany download links',
      mailBody: 'Doukkany download links (always the latest version):\n\nComputer (Windows 10 and newer):\n{win}\n\nPhone (Android):\n{play}\n\nDownload page:\n{page}\n',
      tutorialTitle: 'Quick tutorial',
      tutorialHint: '(click the episode name to watch the video)',
      tutorialAll: 'See the full list on YouTube'
    }
  };

  // "Doukkany on PC" YouTube playlist, in its order. Each link opens the video inside the playlist.
  // Row: [video id, Arabic title, French title, English title, length in seconds].
  var PLAYLIST_ID = 'PLATmdIDov8C4';
  var VIDEOS = [
    ['l487p3PcKrs', 'أول تشغيل لدكّاني على الحاسوب', 'Premier lancement de Doukkany sur PC', 'First start of Doukkany on PC', 56],
    ['knj8FTLcriI', 'الإضافة السريعة للسلعة', 'Ajout rapide d’un produit', 'Quick add of a product', 50],
    ['hwXBqgD0qFU', 'إضافة سلعة بالتفصيل', 'Ajouter un produit en détail', 'Add a product in detail', 61],
    ['UiLl3WZe_iM', 'ترتيب السلع في فئات', 'Classer les produits par catégories', 'Sort products into categories', 46],
    ['HBxeKBFIpbY', 'البيع خطوة بخطوة', 'Vendre étape par étape', 'Selling step by step', 46],
    ['USUIhjNc9wo', 'البيع بالدَّين', 'Vendre à crédit', 'Selling on credit', 49],
    ['cWWeTfazA_Y', 'البيع بتخفيض', 'Vendre avec une remise', 'Selling with a discount', 49],
    ['BecQxkCCNUo', 'البيع بقارئ الباركود', 'Vendre avec le lecteur de code-barres', 'Selling with a barcode scanner', 45],
    ['GYOgSPXsGNA', 'اختصارات لوحة المفاتيح', 'Raccourcis clavier', 'Keyboard shortcuts', 46],
    ['Qfl7T7-zdTM', 'عدة زبائن في وقت واحد', 'Plusieurs clients en même temps', 'Several customers at once', 45],
    ['nX568wrdneU', 'طابعة الإيصالات', 'Imprimante de tickets', 'Receipt printer', 45],
    ['oJIMUt0StMM', 'دفتر الدَّين', 'Carnet de crédit', 'Credit book', 45],
    ['MtRhQZSqdRw', 'إضافة عامل وصلاحياته', 'Ajouter un employé et ses droits', 'Add a staff member and their permissions', 48],
    ['SzjTHiWUKCY', 'الصندوق: الفتح والإغلاق', 'La caisse : ouverture et fermeture', 'Cash drawer: opening and closing', 48],
    ['zj5Wp16lGYE', 'حاسوب ثانٍ وهاتف في المحل', 'Un 2e ordinateur et un téléphone dans le magasin', 'A second computer and a phone in the shop', 52],
    ['bxlT8DnAFWY', 'التقارير والربح', 'Rapports et bénéfice', 'Reports and profit', 45],
    ['qDGltZh8WuM', 'تسجيل وصول السلعة', 'Enregistrer l’arrivée de marchandise', 'Recording new stock', 42],
    ['vgzS9v2wLVw', 'تنبيهات المخزون والصلاحية', 'Alertes de stock et de péremption', 'Stock and expiry alerts', 52],
    ['IXEpl-ptxuE', 'إرجاع سلعة', 'Retour d’un produit', 'Returning a product', 45],
    ['NriEqQDR_D8', 'طباعة الملصقات', 'Impression d’étiquettes', 'Printing labels', 41],
    ['C_tN8K8XnAc', 'استيراد السلع من Excel', 'Importer les produits depuis Excel', 'Import products from Excel', 37],
    ['EH5Sdd2-Ueg', 'سعر التجزئة وسعر الجملة', 'Prix de détail et prix de gros', 'Retail and wholesale prices', 34],
    ['sFtffw9oHFw', 'التصليحات والخدمات', 'Réparations et services', 'Repairs and services', 39],
    ['h4q0r4vEIJg', 'نقاط الوفاء والعروض', 'Points de fidélité et offres', 'Loyalty points and offers', 38],
    ['72vZnHe9ay4', 'النسخة الاحتياطية', 'Sauvegarde', 'Backup', 48]
  ];

  function renderVideos() {
    var col = { ar: 1, fr: 2, en: 3 }[lang];
    var list = document.getElementById('videos');
    list.textContent = '';
    VIDEOS.forEach(function (v, i) {
      var a = document.createElement('a');
      a.href = 'https://www.youtube.com/watch?v=' + v[0] + '&list=' + PLAYLIST_ID + '&index=' + (i + 1);
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = v[col];
      var li = document.createElement('li');
      li.appendChild(a);
      var time = document.createElement('bdi');
      time.className = 'duration';
      time.dir = 'ltr';
      time.textContent = Math.floor(v[4] / 60) + ':' + ('0' + (v[4] % 60)).slice(-2);
      li.appendChild(document.createTextNode(' '));
      li.appendChild(time);
      list.appendChild(li);
    });
  }

  var PLAY_URL = 'https://play.google.com/store/apps/details?id=com.yousoft.doukkany';
  var RELEASE_PAGE = 'https://github.com/dzstoredzd/doukkany-releases/releases/latest';
  // Same "latest Windows version" file the app's auto-update reads.
  var FEED_URL = 'https://raw.githubusercontent.com/dzstoredzd/doukkany-releases/main/doukkany/stable/latest.json';
  var API_URL = 'https://api.github.com/repos/dzstoredzd/doukkany-releases/releases/latest';

  var params = new URLSearchParams(location.search);
  var lang = 'ar';
  var latest = null; // { url, label }

  // ---- Language ----
  function pickLang() {
    var asked = params.get('lang');
    if (TEXT[asked]) return asked;
    try { var saved = localStorage.getItem('doukkany-lang'); if (TEXT[saved]) return saved; } catch (e) {}
    return 'ar'; // Arabic by default; the browser language is not used.
  }

  function setLang(next) {
    lang = next;
    var t = TEXT[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.title = t.title;
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t[el.getAttribute('data-t')]; });
    document.querySelectorAll('[data-t-aria]').forEach(function (el) { el.setAttribute('aria-label', t[el.getAttribute('data-t-aria')]); });
    document.querySelectorAll('.langs button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang));
    });
    showVersion();
    renderVideos();
    var status = document.getElementById('status');
    if (status.textContent) status.textContent = t.starting;
    var err = document.getElementById('email-error');
    if (err.textContent) err.textContent = t.emailBad;
    try { localStorage.setItem('doukkany-lang', lang); } catch (e) {}
  }

  document.querySelectorAll('.langs button').forEach(function (b) {
    b.addEventListener('click', function () { setLang(b.getAttribute('data-lang')); });
  });

  // ---- Latest Windows installer ----
  function fromFeed() {
    return fetch(FEED_URL, { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error('feed ' + r.status); return r.json(); })
      .then(function (f) {
        if (!f.downloadUrl || !/\.exe$/i.test(f.downloadUrl)) throw new Error('feed has no installer');
        return { url: f.downloadUrl, label: f.version + ' (' + f.build + ')' };
      });
  }

  function fromApi() {
    return fetch(API_URL, { headers: { 'Accept': 'application/vnd.github+json' } })
      .then(function (r) { if (!r.ok) throw new Error('api ' + r.status); return r.json(); })
      .then(function (rel) {
        var exe = (rel.assets || []).filter(function (a) { return /^Doukkany-.*\.exe$/i.test(a.name); })[0];
        if (!exe) throw new Error('release has no installer');
        var m = /^v?(\d+\.\d+\.\d+)-(\d+)$/.exec(rel.tag_name || '');
        return { url: exe.browser_download_url, label: m ? m[1] + ' (' + m[2] + ')' : rel.tag_name };
      });
  }

  // Resolved once; every click and ?get=windows waits for the same answer.
  var latestPromise = fromFeed().catch(fromApi).then(function (found) {
    latest = found;
    document.getElementById('win-btn').href = found.url;
    showVersion();
    return found;
  }).catch(function () { return null; });

  function showVersion() {
    var v = document.getElementById('version');
    v.textContent = latest && latest.label ? TEXT[lang].version + latest.label : '';
  }

  function startDownload() {
    document.getElementById('status').textContent = TEXT[lang].starting;
    latestPromise.then(function (found) {
      // If GitHub could not be reached, open the latest release page instead.
      location.href = found ? found.url : RELEASE_PAGE;
    });
  }

  document.getElementById('win-btn').addEventListener('click', function (e) {
    if (latest) return; // the link already points to the newest installer
    e.preventDefault();
    startDownload();
  });

  // ---- Send links by email (opens the visitor's own email app) ----
  function pageUrl() { return location.origin + location.pathname; }

  document.getElementById('email-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var t = TEXT[lang];
    var input = document.getElementById('email');
    var to = input.value.trim();
    var err = document.getElementById('email-error');
    if (to && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)) {
      err.textContent = t.emailBad;
      input.focus();
      return;
    }
    err.textContent = '';
    var body = t.mailBody
      .replace('{win}', pageUrl() + '?get=windows&lang=' + lang)
      .replace('{play}', PLAY_URL)
      .replace('{page}', pageUrl() + '?lang=' + lang);
    location.href = 'mailto:' + encodeURIComponent(to).replace('%40', '@') +
      '?subject=' + encodeURIComponent(t.mailSubject) +
      '&body=' + encodeURIComponent(body);
  });

  setLang(pickLang());
  // A shared link like .../download/?get=windows starts the newest installer download.
  if (params.get('get') === 'windows') startDownload();
})();
</script>
</body>
</html>
