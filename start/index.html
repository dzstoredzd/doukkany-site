  :root {
    --logo: #16955F; --green: #117A4B; --deep: #0B4A2E; --mint: #DDF2E6; --mint-2: #EEF8F2;
    --ink: #17212B; --muted: #4F5D69; --line: #DCE6E0; --bg: #F5F8F6; --card: #fff;
    --wa: #25D366; --warn-bg: #FFF8E1; --warn-line: #F3DC8B; --warn-ink: #5B4300;
    --r-lg: 22px; --r-md: 16px; --r-sm: 12px;
    --shadow: 0 1px 2px rgba(23,33,43,.05), 0 8px 24px rgba(17,122,75,.08);
    --pad: 16px; --consent-h: 0px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: D, system-ui, "Segoe UI", Tahoma, Arial, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; }
  img { max-width: 100%; }
  a { color: var(--green); }
  h1, h2, h3, p, ul, ol { margin: 0; }

  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--logo); outline-offset: 2px; border-radius: 8px; }
  h1:focus, h2:focus { outline: none; }
  .wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 0 var(--pad); }
  .ic { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  [dir="rtl"] .flip { transform: scaleX(-1); }
  .ltr { direction: ltr; unicode-bidi: isolate; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---- Header + progress ---- */
  .top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; }
  .logo { display: flex; align-items: center; text-decoration: none; }
  .logo img { display: block; height: 34px; width: auto; }
  .logo .lat { height: 22px; }
  html[lang="ar"] .logo .lat, html:not([lang="ar"]) .logo .ar { display: none; }
  .langs { display: flex; gap: 2px; padding: 3px; background: #fff; border: 1px solid var(--line); border-radius: 999px; }
  .langs button { background: transparent; border: 0; border-radius: 999px; padding: 6px 10px; min-height: 40px; min-width: 44px; cursor: pointer; font-size: .88rem; font-weight: 600; color: var(--muted); }
  .langs button[aria-pressed="true"] { background: var(--green); color: #fff; }
  .prog { display: flex; align-items: center; gap: 10px; min-height: 48px; }
  .back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; min-width: 44px; padding: 0 10px 0 6px; border: 0; border-radius: 12px; background: transparent; color: var(--green); font-weight: 700; cursor: pointer; }
  .back:hover { background: var(--mint-2); }
  /* One small segment per step, filled up to the current one */
  .bar { flex: 1; display: flex; gap: 4px; height: 6px; }
  .bar i { flex: 1; border-radius: 6px; background: #E1EAE4; transition: background .3s; }
  .bar i.on { background: var(--green); }
  .prog-txt { font-size: .85rem; font-weight: 600; color: var(--muted); white-space: nowrap; }

  /* ---- Steps ---- */
  main { flex: 1; padding-bottom: 24px; }
  .step { padding: 10px 0 8px; animation: in .22s ease-out; }
  /* Only a small slide, never a fade: if a browser pauses animations (hidden tab, some in-app
     browsers), the screen must still be fully visible. */
  @keyframes in { from { transform: translateY(8px); } to { transform: none; } }
  .step h1 { font-size: clamp(1.55rem, 6.4vw, 2.2rem); font-weight: 700; line-height: 1.25; }
  .lead { color: var(--muted); font-weight: 600; font-size: 1.05rem; margin-top: 6px; }
  .q-sub { color: var(--muted); margin-top: 4px; }
  .block { margin-top: 18px; }

  /* Big choice cards (one tap = answer) */
  .choices { display: grid; gap: 12px; margin-top: 20px; }
  .choice { display: flex; align-items: center; gap: 14px; width: 100%; text-align: start; padding: 16px; min-height: 84px; background: var(--card); border: 2px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow); cursor: pointer; transition: border-color .15s, transform .1s, background .15s; }
  .choice:hover { border-color: #9FD3B8; }
  .choice:active { transform: scale(.99); }
  .choice[aria-pressed="true"] { border-color: var(--green); background: var(--mint-2); }
  .choice .ci { flex: none; width: 52px; height: 52px; border-radius: 14px; background: var(--mint); color: var(--green); display: grid; place-items: center; }
  /* Coloured icons (--c set per card): a light tint of the colour behind the icon. */
  .choice[style*="--c"] .ci, .tile[style*="--c"] .ci, .pick[style*="--c"]:not(.primary) .pv { color: var(--c); background: color-mix(in srgb, var(--c) 14%, #fff); }
  .choice .ci .ic { width: 28px; height: 28px; }
  .choice .ct { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .choice b { font-size: 1.12rem; line-height: 1.35; }
  .choice .cd { color: var(--muted); font-size: .95rem; font-weight: 600; }
  .choice .tag { align-self: flex-start; margin-top: 4px; font-size: .78rem; font-weight: 700; color: var(--green); background: var(--mint); padding: 1px 8px; border-radius: 999px; }
  .choice .go { flex: none; color: var(--green); }
  /* Shop type tiles */
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
  .tile { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px 12px; min-height: 104px; text-align: start; background: var(--card); border: 2px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow); cursor: pointer; font-weight: 700; line-height: 1.35; transition: border-color .15s, background .15s; }
  .tile:hover { border-color: #9FD3B8; }
  .tile[aria-pressed="true"] { border-color: var(--green); background: var(--mint-2); }
  .tile .ci { width: 42px; height: 42px; border-radius: 12px; background: var(--mint); color: var(--green); display: grid; place-items: center; }
  .tile .ci .ic { width: 24px; height: 24px; }
  /* Shop types: a list, one per row, each icon in its own colour (--c set per row). */
  .tiles.list { grid-template-columns: 1fr; gap: 8px; }
  .tiles.list .tile { flex-direction: row; align-items: center; gap: 12px; min-height: 64px; padding: 10px 14px; }
  .tiles.list .tile .ci { flex: none; color: var(--c, var(--green)); background: var(--mint); background: color-mix(in srgb, var(--c, var(--green)) 14%, #fff); }
  .tiles.list .tile .tl { flex: 1; min-width: 0; }
  .tiles.list .tile .go { flex: none; width: 20px; height: 20px; color: var(--muted); }
  .tiles.list .tile[aria-pressed="true"] .go { color: var(--green); }
  /* "What bothers you most?" tiles: the fix shows as soon as one is picked */
  .tile.pain { font-size: .98rem; }
  .tile .fix { display: inline-flex; align-items: flex-start; gap: 4px; font-size: .85rem; color: var(--green); }
  .tile .fix .ic { width: 16px; height: 16px; margin-top: 3px; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; padding: 10px 22px; border-radius: var(--r-md); border: 0; cursor: pointer; font-weight: 700; font-size: 1.08rem; text-decoration: none; background: var(--green); color: #fff; box-shadow: 0 10px 22px rgba(17,122,75,.22); transition: background .15s; text-align: center; }
  .btn:hover { background: #0D6A40; }
  .btn[disabled] { background: #A9BDB2; box-shadow: none; cursor: not-allowed; }
  .btn .ic { width: 22px; height: 22px; }
  .btn.soft { background: #fff; color: var(--green); border: 2px solid var(--green); box-shadow: none; min-height: 50px; font-size: 1rem; }
  .btn.soft:hover { background: var(--mint-2); }
  .btn.wa { background: var(--wa); color: #06331A; box-shadow: 0 10px 22px rgba(37,211,102,.25); }
  .btn.wa:hover { background: #1FBE5B; }
  .btn.block { width: 100%; }
  .link { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 4px; border: 0; background: none; color: var(--green); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
  .actions .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; }

  /* Bottom action bar on phones: the next step is always in reach. Lifted above the consent bar. */
  .dock { position: sticky; bottom: var(--consent-h); z-index: 20; margin: 20px calc(-1 * var(--pad)) 0; padding: 12px var(--pad) calc(12px + env(safe-area-inset-bottom)); background: rgba(245,248,246,.96); border-top: 1px solid var(--line); backdrop-filter: blur(6px); display: flex; flex-direction: column; gap: 6px; }
  .dock .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 16px; }

  .facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .facts li { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: .9rem; font-weight: 600; }
  .facts .ic { color: var(--green); width: 18px; height: 18px; }

  .note { background: var(--mint-2); border: 1px solid #CDE8D8; border-radius: var(--r-sm); padding: 12px 14px; font-size: .95rem; }
  .note b { display: block; }
  .warn { background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-ink); border-radius: var(--r-sm); padding: 12px 14px; font-weight: 600; font-size: .95rem; }
  .resume { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 16px; }
  .resume p { flex: 1 1 200px; font-weight: 600; }

  /* "Other" shop type */
  .field { display: flex; flex-direction: column; gap: 6px; margin-top: 16px; }
  .field label { font-weight: 700; }
  .field input { font: inherit; font-size: 1.05rem; min-height: 52px; padding: 10px 14px; border: 2px solid var(--line); border-radius: var(--r-sm); background: #fff; color: var(--ink); }
  .field input:focus { border-color: var(--green); outline: none; }

  .card .field:first-of-type { margin-top: 12px; }

  .pill[aria-pressed="true"] { border-color: var(--green); background: var(--mint-2); color: var(--deep); }

  /* "Watch all the episodes on YouTube": the red YouTube logo, like /learn/. */
  .yt-all .ic { color: #E62117; width: 24px; height: 24px; }
  /* The order form's robot trap: never seen by people. Never push it far sideways (a big negative left):
     on this right-to-left page that made the page 10 000 px wide and phones zoomed out. */
  .hp { position: absolute; width: 1px; height: 1px; margin: 0; padding: 0; border: 0; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%); opacity: 0; pointer-events: none; }
  .field small { color: var(--muted); }

  /* Device counts */
  .count { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px; background: #fff; border: 1px solid var(--line); border-radius: var(--r-md); margin-top: 10px; }
  .count .cl { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .count .cl .ic { color: var(--green); width: 26px; height: 26px; }
  .stepper { display: flex; align-items: center; gap: 4px; direction: ltr; }
  .stepper button { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--green); background: #fff; color: var(--green); font-size: 1.5rem; font-weight: 700; line-height: 1; cursor: pointer; }
  .stepper button[disabled] { border-color: var(--line); color: #A9B7AF; cursor: not-allowed; }
  .stepper output { min-width: 40px; text-align: center; font-size: 1.4rem; font-weight: 700; }
  .seg { display: grid; gap: 10px; margin-top: 10px; }
  .seg .choice { min-height: 0; }

  /* Features */
  .feat-grid { display: grid; gap: 18px; margin-top: 16px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--mint); color: var(--deep); font-weight: 700; border-radius: 999px; padding: 3px 12px; font-size: .92rem; margin-top: 8px; }
  .feats { display: grid; gap: 8px; }
  .feat { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: start; padding: 12px 14px; background: #fff; border: 2px solid var(--line); border-radius: var(--r-md); cursor: pointer; transition: border-color .15s, background .15s; }
  .feat[aria-pressed="true"] { border-color: var(--green); background: var(--mint-2); }
  .feats .feat { cursor: default; }
  .feat .ok { flex: none; width: 36px; height: 36px; border-radius: 10px; background: var(--mint); color: var(--green); display: grid; place-items: center; }
  .feat .ok[style*="--c"] { color: var(--c); background: color-mix(in srgb, var(--c) 14%, #fff); }
  .feat .ok .ic { width: 20px; height: 20px; }
  .feat b { display: block; font-size: 1.02rem; line-height: 1.4; }
  .feat span.fd { display: block; color: var(--muted); font-size: .92rem; font-weight: 600; }
  .feat .why-tag { display: inline-block; margin-top: 6px; font-size: .8rem; font-weight: 700; color: var(--deep); background: var(--mint); padding: 1px 10px; border-radius: 999px; }
  .shot { display: flex; justify-content: center; }
  .phn { width: 210px; padding: 6px; border-radius: 30px; background: #121816; box-shadow: 0 18px 36px rgba(20,45,32,.22), inset 0 0 0 1.5px #2C3430; }
  .phn .scr { border-radius: 24px; overflow: hidden; background: #F3F6F9; aspect-ratio: 9 / 16; }
  .phn img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .phn .none { height: 100%; display: grid; place-items: center; padding: 20px; text-align: center; color: var(--muted); font-weight: 600; }

  /* Price */
  .offer { position: relative; background: #fff; border: 2px solid var(--green); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 22px 18px 18px; margin-top: 22px; }

  .offer h2 { font-size: 1.35rem; font-weight: 700; line-height: 1.3; }
  .offer .od { color: var(--muted); font-weight: 600; margin-top: 2px; }
  .price { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin-top: 12px; }
  .price .amt { font-size: clamp(2rem, 9vw, 2.6rem); font-weight: 700; color: var(--deep); line-height: 1.1; }

  .lesson { display: flex; align-items: center; gap: 12px; padding: 10px 12px; text-decoration: none; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); min-height: 76px; }

  /* ---- App shell (app.js adds html.app): the page never scrolls, like an app screen.
     Header at the top, then each step = question (.head) + answers (.scroll, the only part
     that scrolls) + buttons (.dock). Without JavaScript the page stays a normal page. ---- */
  html.app, html.app body { overflow: hidden; overscroll-behavior: none; }
  html.app body { height: var(--app-h, 100vh); min-height: 0; padding-bottom: var(--consent-h); }
  html.app header { flex: none; }
  html.app main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-bottom: 0; }
  html.app #view { flex: 1; min-height: 0; display: flex; flex-direction: column; max-width: none; padding: 0; }
  html.app .step { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0; animation: none; }
  /* Only the question and the list slide in: if a browser pauses animations, the buttons
     must still sit fully on the screen. */
  html.app .step > .head, html.app .step > .scroll { animation: in .22s ease-out; }
  /* Same text width as the old .wrap (760px), but the list scrolls edge to edge. */
  html.app .step > .head, html.app .step > .scroll, html.app .step > .dock { padding-inline: max(var(--pad), calc((100% - 760px) / 2 + var(--pad))); }
  html.app .step > .head { flex: none; padding-top: 8px; padding-bottom: 10px; position: relative; z-index: 2; transition: box-shadow .2s; }
  html.app .step.scrolled > .head { box-shadow: 0 8px 12px -10px rgba(23,33,43,.35); }
  /* position: relative = the list holds its own absolute children (the order form's hidden
     robot field), else they stretch the page and it scrolls. */
  html.app .step > .scroll { position: relative; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding-bottom: 16px; }
  html.app .step > .scroll > :first-child { margin-top: 6px; }
  html.app .step > .scroll > .offer:first-child { margin-top: 20px; } /* room for its "best for you" label */
  /* Soft fade at the bottom of the list: there is more below. */
  html.app .step > .scroll::after { content: ""; position: sticky; bottom: -16px; display: block; height: 28px; margin-top: -12px; background: linear-gradient(rgba(245,248,246,0), var(--bg)); pointer-events: none; }
  html.app .step > .dock { flex: none; position: relative; bottom: auto; z-index: 3; margin: 0; padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); backdrop-filter: none; }
  /* Welcome (v2): headline, the app on a PC and a phone, benefits and links, then the two
     buttons fixed at the bottom so the main one is always in reach (owner brief §3). */
  html.app .step[data-step="welcome"] > .head { text-align: center; padding-top: 12px; padding-bottom: 0; }
  html.app .step[data-step="welcome"] > .scroll { text-align: center; }
  html.app .step[data-step="welcome"] > .scroll::after { display: none; }
  html.app.at-welcome .step[data-step="welcome"] > .dock { position: sticky; bottom: var(--consent-h); }
  /* Wide screens: no empty band between the content and the buttons; the whole group sits
     in the middle of the screen. */
  @media (min-width: 600px) {
    html.app .step[data-step="welcome"] { justify-content: center; }
    html.app .step[data-step="welcome"] > .scroll { flex: none; }
    html.app .step[data-step="welcome"] > .dock { border-top: 0; padding-top: 18px; }
    html.app .step[data-step="welcome"] > .dock .btn { width: 380px; min-width: 0; }
  }
  /* The first page stays a normal page: no lock, so slide-down-to-refresh works. Its cards
     still sit at the bottom; on a very short screen the whole page scrolls instead. */
  html.app.at-welcome, html.app.at-welcome body { overflow: visible; overscroll-behavior: auto; }
  html.app.at-welcome body { height: auto; min-height: var(--app-h, 100vh); }
  html.app.at-welcome .step[data-step="welcome"] > .scroll { overflow: visible; min-height: auto; overscroll-behavior: auto; }
  @media (min-width: 600px) {
