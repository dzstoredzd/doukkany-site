  });

  // ---- Video player: YouTube loads only after a click (youtube-nocookie). ----
  // Ctrl/middle click, or a browser without <dialog>, opens the video on YouTube.
  var player = $('player');
  var canDialog = typeof player.showModal === 'function';
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[data-v]');
    if (!a) return;
    var i = +a.getAttribute('data-v');
    track('tutorial_clicked', { tutorial_id: VIDEOS[i][0], tutorial_category: VIDEOS[i][5], tutorial_position: i + 1 });
    if (!canDialog || e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return;
    e.preventDefault();
    $('player-title').textContent = (i + 1) + '. ' + title(i);
    $('player-yt').href = videoUrl(i);
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/' + VIDEOS[i][0] + '?autoplay=1&rel=0&playsinline=1&hl=' + lang;
    f.title = title(i);
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    $('player-frame').textContent = '';
    $('player-frame').appendChild(f);
    player.showModal();
  });
  $('player-close').addEventListener('click', function () { player.close(); });
  player.addEventListener('click', function (e) { if (e.target === player) player.close(); });
  player.addEventListener('close', function () { $('player-frame').textContent = ''; });
  $('yt-all').addEventListener('click', function () {
    track('tutorial_clicked', { tutorial_id: 'playlist', tutorial_category: 'playlist' });
  });
  $('wa-btn').addEventListener('click', function () {
    track('whatsapp_support_clicked', { link_type: 'whatsapp', method: 'learn' });
  });

  setLang(pickLang());
})();
</script>
</body>
</html>
